version: '3.8'

services:
  # Redis for Event Streams & Sessions
  redis:
    image: redis:7-alpine
    container_name: hover-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for Metadata
  postgres:
    image: postgres:16-alpine
    container_name: hover-postgres
    environment:
      POSTGRES_DB: hover
      POSTGRES_USER: hover
      POSTGRES_PASSWORD: hover_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hover"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ClickHouse for Event Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: hover-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: hover
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ingestion API (BE1 - Event Collector)
  ingestion-api:
    build:
      context: ./backend/packages/ingestion-api
      dockerfile: Dockerfile
    container_name: hover-ingestion-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Stream Worker & Gemini AI Rule Engine (BE2)
  stream-worker:
    build:
      context: ./backend/packages/stream-worker
      dockerfile: Dockerfile
    container_name: hover-stream-worker
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
      CLICKHOUSE_URL: http://clickhouse:8123
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # Decision API (BE2 - Realtime Intervention Engine)
  decision-api:
    build:
      context: ./backend/packages/decision-api
      dockerfile: Dockerfile
    container_name: hover-decision-api
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Web App (React 18 + Vite SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoverstay-frontend
    ports:
      - "5100:5100"
    environment:
      VITE_INGESTION_API: http://localhost:4000
      VITE_DECISION_API: http://localhost:4001
    depends_on:
      - ingestion-api
      - decision-api
    restart: unless-stopped

networks:
  default:
    name: hoverstay-network
