version: '3.8'

services:
  # ── Infra ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hover-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: hover-postgres
    environment:
      POSTGRES_DB: hover
      POSTGRES_USER: hover
      POSTGRES_PASSWORD: hover_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hover"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: hover-clickhouse
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: hover
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend APIs ───────────────────────────────────────
  ingestion-api:
    build:
      context: ./packages/backend/ingestion-api
      dockerfile: Dockerfile
    container_name: hover-ingestion-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stream-worker:
    build:
      context: ./packages/backend/stream-worker
      dockerfile: Dockerfile
    container_name: hover-stream-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
      CLICKHOUSE_URL: http://clickhouse:8123
      THRESHOLDS_PATH: /app/config/thresholds.yml
    volumes:
      - ./packages/backend/shared/config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  decision-api:
    build:
      context: ./packages/backend/decision-api
      dockerfile: Dockerfile
    container_name: hover-decision-api
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard-api:
    build:
      context: ./packages/backend/dashboard-api
      dockerfile: Dockerfile
    container_name: hover-dashboard-api
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://hover:hover_dev@postgres:5432/hover
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Demo Site ─────────────────────────────────
  demo-site:
    image: node:20-alpine
    container_name: hover-demo-site
    working_dir: /app
    volumes:
      - ./packages/demo-site:/app
    command: npx http-server . -p 3000 -c-1 --cors
    ports:
      - "3000:3000"
    depends_on:
      - ingestion-api
      - decision-api
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  clickhouse_data:

networks:
  default:
    name: hover-network
