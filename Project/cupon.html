<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-primary": "#a5c8ff",
                    "on-primary-fixed": "#001c3a",
                    "on-surface-variant": "#424750",
                    "surface-dim": "#d9dadf",
                    "secondary": "#585f67",
                    "tertiary-container": "#793f00",
                    "outline": "#737781",
                    "on-primary-container": "#9ac2ff",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#2f5f9b",
                    "on-secondary-container": "#5e656d",
                    "tertiary": "#582c00",
                    "on-tertiary-fixed": "#2f1500",
                    "inverse-surface": "#2e3035",
                    "on-surface": "#1a1c20",
                    "surface-container-highest": "#e2e2e8",
                    "surface-container": "#ededf3",
                    "surface": "#f9f9ff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#ffb77e",
                    "on-tertiary-fixed-variant": "#6e3900",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "on-background": "#1a1c20",
                    "on-secondary-fixed": "#151c23",
                    "on-primary-fixed-variant": "#0d4782",
                    "surface-variant": "#e2e2e8",
                    "outline-variant": "#c2c6d1",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#00386b",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffdcc3",
                    "surface-bright": "#f9f9ff",
                    "primary-container": "#1a4f8a",
                    "on-tertiary-container": "#ffae6b",
                    "on-secondary-fixed-variant": "#40474f",
                    "background": "#f9f9ff",
                    "surface-container-low": "#f3f3f9",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f0f0f6",
                    "surface-container-high": "#e8e8ed",
                    "secondary-fixed-dim": "#c0c7d1",
                    "primary-fixed": "#d4e3ff",
                    "secondary-fixed": "#dce3ed",
                    "secondary-container": "#dce3ed",
                    "primary-fixed-dim": "#a5c8ff",
                    "warm-gold": "#F5A623"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "nav-height": "64px",
                    "max-width": "1200px",
                    "gutter": "24px",
                    "card-padding": "16px",
                    "section-gap": "48px",
                    "nav-padding-horiz": "40px"
            },
            "fontFamily": {
                    "price-highlight": ["Manrope"],
                    "page-title": ["Manrope"],
                    "helper-text": ["Manrope"],
                    "card-title": ["Manrope"],
                    "body-main": ["Manrope"],
                    "section-title": ["Manrope"]
            },
            "fontSize": {
                    "price-highlight": ["22px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "page-title": ["28px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "helper-text": ["13px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "card-title": ["16px", {"lineHeight": "1.5", "fontWeight": "600"}],
                    "body-main": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "section-title": ["20px", {"lineHeight": "1.5", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<!-- Desktop Modal Popup -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay">
<!-- Modal Card -->
<div class="w-[480px] bg-white rounded-xl overflow-hidden custom-shadow relative">
<!-- Close Button -->
<button class="absolute top-4 right-4 z-20 w-8 h-8 bg-black/20 hover:bg-black/40 rounded-full flex items-center justify-center text-white transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<!-- Modal Header: Hero Image -->
<div class="h-[200px] relative">
<img class="w-full h-full object-cover" data-alt="A serene and luxurious hotel bedroom with high-end linens, soft morning sunlight filtering through sheer white curtains, and a minimalist design. The room features subtle gold accents and a deep navy color palette, creating a tranquil and professional atmosphere that suggests premium hospitality and comfort." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-5BYl8GI-MQoUpxFeqYPWfBnD785T7NEubl2LAuB4PKVq--UMebiVlLksbNDZJdar0GiXnG6tmuX2OUnMVx8K1hLtLrkgTbnuhZZyTG9SoWGEhHcu31v1M_JtCznB9GsuvlE5D31Nzwh3EoUUo9KxdneZCRKPWtL0-baRaysU3U4cUQnAwcdEo63xh4o6ypDt9gvcohjvqqS1sDbnYh16VgSL9H3jjaJCptJKL9cIapIV46ymIu9kesvXrafOCFEN20umXuVH4bw4"/>
<!-- Gold Badge -->
<div class="absolute top-4 left-4 bg-warm-gold text-white px-3 py-1 rounded-full font-bold text-[12px] shadow-sm">
                    한정 혜택
                </div>
</div>
<!-- Modal Body -->
<div class="p-[28px]">
<div class="text-center mb-6">
<h2 class="font-section-title text-section-title text-on-surface mb-1">잠깐, 아직 기회가 있어요!</h2>
<p class="font-body-main text-body-main text-on-surface-variant">지금 예약하시면 특별 할인을 드립니다</p>
</div>
<!-- Center Discount Box -->
<div class="bg-[#EAF1FB] rounded-xl p-[20px] text-center mb-6">
<div class="text-[48px] font-bold text-primary-container leading-none mb-1">10%</div>
<div class="font-helper-text text-helper-text text-on-surface-variant">즉시 할인 적용</div>
</div>
<!-- Coupon Box -->
<div class="bg-surface-container rounded-lg px-4 py-3 flex items-center justify-between mb-4">
<span class="font-mono font-bold text-on-surface text-[16px] tracking-wider">HOVER10</span>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</button>
</div>
<!-- Helper Text -->
<p class="text-center font-helper-text text-helper-text text-on-surface-variant">
                    지금부터 10분 안에 예약 시 적용
                </p>
</div>
<!-- Modal Footer -->
<div class="px-[28px] pb-[28px] space-y-4">
<button class="w-full h-12 bg-warm-gold hover:bg-[#e09820] text-white rounded-lg font-bold text-[16px] transition-all active:scale-[0.98]">
                    지금 할인 받기
                </button>
<div class="text-center">
<button class="text-on-surface-variant hover:text-on-surface transition-colors font-body-main text-body-main border-b border-transparent hover:border-on-surface-variant">
                        괜찮습니다, 정가로 예약할게요
                    </button>
</div>
</div>
</div>
</div>

</body></html>

<script src="hover-client.js"></script>
